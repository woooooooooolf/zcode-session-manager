[workspace]
resolver = "2"
members = ["crates/zsm-core", "src-tauri"]

[workspace.package]
version = "1.4.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
dirs = "6"
chrono = "0.4"
sysinfo = "0.39"

[profile.release]
strip = true
