[workspace]
resolver = "2"
members = ["crates/zsm-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
dirs = "5"
chrono = "0.4"
sysinfo = "0.30"

[profile.release]
strip = true
